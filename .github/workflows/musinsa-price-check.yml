name: Musinsa Price Check

on:
  schedule:
    # GitHub often delays scheduled runs by hours on low-activity repos (observed
    # 2026-09-21/22: 10:07 UTC cron fired at 16:26 / 14:46 UTC), and :00 is the most
    # congested minute. Run several times a day so at least one lands before the
    # 19:20 KST alert routine; the script merges same-day runs idempotently.
    - cron: '17 3 * * *'  # ~12:17 KST
    - cron: '37 6 * * *'  # ~15:37 KST
    - cron: '7 9 * * *'   # ~18:07 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: musinsa-price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run wishlist sync + price check
        run: node musinsa-price-tracker/scripts/check-and-update.js

      - name: Commit changes
        run: |
          git config user.name "musinsa-price-bot"
          git config user.email "actions@github.com"
          git add musinsa-price-tracker/data/prices.json musinsa-price-tracker/data/last_run_summary.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "musinsa price check: $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
