name: Musinsa Price Check

on:
  schedule:
    - cron: '0 10 * * *' # 19:00 KST daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run wishlist sync + price check
        run: node musinsa-price-tracker/scripts/check-and-update.js

      - name: Commit changes
        run: |
          git config user.name "musinsa-price-bot"
          git config user.email "actions@github.com"
          git add musinsa-price-tracker/data/prices.json musinsa-price-tracker/data/last_run_summary.json
          git diff --cached --quiet || git commit -m "musinsa price check: $(date -u +%Y-%m-%d)"
          git push
